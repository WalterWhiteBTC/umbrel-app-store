manifestVersion: 1
id: walterwhitebtc-monitoring
name: WalterWhiteBTC Monitoring
tagline: Prometheus et Node Exporter pour superviser votre Umbrel
icon: https://raw.githubusercontent.com/WalterWhiteBTC/umbrel-app-store/master/walterwhitebtc-monitoring/icon.svg
category: Development
version: "1.0.0"
port: 9091
description: >-
  WalterWhiteBTC Monitoring collecte et conserve les metriques systeme de votre
  serveur Umbrel avec Prometheus et Node Exporter. Il fournit les donnees CPU,
  memoire, stockage, temperature et reseau utilisables dans Grafana. Les mesures
  sont collectees toutes les 15 secondes et conservees pendant 30 jours, avec
  une limite de stockage de 2 Go.
developer: WalterWhiteBTC
website: https://github.com/WalterWhiteBTC
submitter: WalterWhiteBTC
submission: https://github.com/WalterWhiteBTC/umbrel-app-store
repo: https://github.com/WalterWhiteBTC/umbrel-app-store
support: https://github.com/WalterWhiteBTC/umbrel-app-store/issues
gallery: []
releaseNotes: >-
  Premiere version : Prometheus 3.14.0, Node Exporter 1.12.1, retention de
  30 jours et acces compatible avec Grafana.
