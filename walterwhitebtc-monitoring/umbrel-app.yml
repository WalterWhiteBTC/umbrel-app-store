manifestVersion: 1
id: walterwhitebtc-monitoring
name: WalterWhiteBTC Monitoring
tagline: Supervision de votre Umbrel et de votre Fluminer T3
icon: https://raw.githubusercontent.com/WalterWhiteBTC/umbrel-app-store/master/walterwhitebtc-monitoring/icon.svg
category: Development
version: "1.1.0"
port: 9091
description: >-
  WalterWhiteBTC Monitoring collecte et conserve les metriques systeme de votre
  serveur Umbrel avec Prometheus et Node Exporter. Il collecte egalement en
  lecture seule le hashrate, la puissance, les temperatures, les ventilateurs,
  les shares et l'etat de la pool du Fluminer T3 local. Les mesures sont
  utilisables dans Grafana, relevees toutes les 15 secondes et conservees pendant
  30 jours, avec une limite de stockage de 2 Go.
storage:
  dataRoot: data
developer: WalterWhiteBTC
website: https://github.com/WalterWhiteBTC
submitter: WalterWhiteBTC
submission: https://github.com/WalterWhiteBTC/umbrel-app-store
repo: https://github.com/WalterWhiteBTC/umbrel-app-store
support: https://github.com/WalterWhiteBTC/umbrel-app-store/issues
gallery: []
releaseNotes: >-
  Version 1.1.0 : ajout d'un collecteur Fluminer T3 strictement en lecture seule,
  metriques de hashrate, energie, temperature, ventilateurs, shares et pool,
  prise en charge de l'arret nocturne du mineur et tableau de bord Grafana
  dedie. Aucune adresse Bitcoin ni aucun mot de passe n'est exporte.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
